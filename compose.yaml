# Starts the whole stack: `docker compose up --build`.
# Settings come from .env (copy .env.example). Postgres and Redis have no host
# ports; the API and dashboard are published on 127.0.0.1 only.
name: crypto-trading

services:
  db:
    image: timescale/timescaledb:2.31.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env (see .env.example)}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ passes a literal $ through, so the variable is read inside the container.
      # -h 127.0.0.1: over TCP, as the other services connect. On a new volume the image
      # first runs a temporary server on the Unix socket only, for its init scripts, and a
      # socket check would call that healthy ~13 s before TCP connections work.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.11-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies database migrations (Alembic), then exits. The API and engine wait
  # for it to finish successfully, so they never run against an out-of-date schema.
  # Reuses the engine image, which already contains shared/ and its migrations.
  migrate:
    build:
      context: .
      dockerfile: engine/Dockerfile
    env_file: .env
    command: ["python", "-m", "shared.db.migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Settings are validated at startup by shared/config.py.
    env_file: .env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The slim Python image has no curl; urlopen raises (exit 1) on any non-2xx.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Healthy only if the heartbeat loop touched its file in the last 30 s,
      # which proves the loop is running, not just that the process exists.
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/engine-heartbeat') > 30)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Runs the dashboard's backtests (D48), apart from the engine: a long backtest is
  # CPU-bound and must never hold up live prices, stops or the kill switch. Same image
  # as the engine; it reads candles and writes backtest_runs, and never trades.
  backtester:
    build:
      context: .
      dockerfile: engine/Dockerfile
    env_file: .env
    command: ["python", "-m", "engine.backtest.worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Its heartbeat file, touched every 10 s, also while a backtest runs.
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/backtester-heartbeat') > 30)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Where the dashboard's /api/* goes (next.config.ts): the API service, inside the
        # Compose network. Baked in at build time.
        API_URL: http://api:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  redisdata:
