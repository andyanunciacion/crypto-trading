[project]
name = "shared"
version = "0.1.0"
description = "Code used by both backend and engine: config, models, schemas, money helpers"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.16.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
