[project]
name = "shared"
version = "0.1.0"
description = "Code used by both backend and engine: config, models, schemas, money helpers"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "sentry-sdk>=2.73.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
