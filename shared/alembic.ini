# Only for Alembic's own CLI, e.g. starting a new migration file:
#   uv run alembic -c shared/alembic.ini revision --rev-id 0002 -m "add orders"
# Migrations are applied with `python -m shared.db.migrate` (the `migrate` service in
# compose.yaml), which doesn't read this file. Number revisions in order (0002, 0003, ...)
# and write their contents by hand; TimescaleDB parts need raw SQL anyway.
[alembic]
script_location = %(here)s/src/shared/db/migrations
file_template = %%(rev)s_%%(slug)s
