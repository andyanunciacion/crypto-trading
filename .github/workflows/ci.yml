# Re-runs the pre-commit checks on GitHub for every push, so a skipped or missing hook
# (`git commit --no-verify`, a fresh clone) still shows a red X before anything merges.
# Third-party actions are pinned to a commit SHA, not a tag: a tag can be moved to other
# code, a SHA can't. The comment after each one names the release it points to.
name: CI

on:
  push:
  workflow_dispatch:

# Read-only token: CI checks code, it never writes to the repo.
permissions:
  contents: read

# A new push to the same branch cancels the run that's now out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same uv as the Dockerfiles. Python 3.12 comes from .python-version.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # --locked fails if uv.lock is out of date with the pyproject.toml files.
      - run: uv sync --all-packages --locked
      # No --fix here: CI reports problems, it never edits code.
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Tests set their own env vars and never read .env, so CI needs no secrets.
      - run: uv run pytest

  frontend:
    name: Frontend (tsc, ESLint, Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same Node as frontend/Dockerfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
      # Installs the pnpm version named in package.json's "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, so a key committed and later deleted is still caught.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Same gitleaks as .pre-commit-config.yaml, from its official image.
      - run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0
          git /repo --redact --verbose
